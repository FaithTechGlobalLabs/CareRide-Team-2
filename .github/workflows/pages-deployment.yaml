on:
  pull_request:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build and deploy
        required: true
        type: string
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: react-web-careride/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: react-web-careride
      - name: Build React frontend
        env: 
          VITE_API_URL: https://care-ride-backend-385995384580.us-central1.run.app/
        run: npm run build
        working-directory: react-web-careride
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: react-web-careride
          command: pages deploy dist --project-name=careride --branch=${{ inputs.branch || github.head_ref || github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
