on:
  push:
    branches: ['**']
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: react-web-careride/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: react-web-careride
      - name: Build React frontend
        env: 
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build
        working-directory: react-web-careride
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: react-web-careride
          command: pages deploy dist --project-name=careride --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
